services:
  postgres:
    image: postgres:16
    container_name: train-ticketing-postgres
    environment:
      POSTGRES_DB: train_ticketing
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: train-ticketing-backend
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/train_ticketing
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: train-ticketing-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data: